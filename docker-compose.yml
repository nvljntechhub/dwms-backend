version: '3.9'
services:
  postgres:
    image: postgres:15
    container_name: dwms_postgres
    restart: always
    environment:
      POSTGRES_DB: dwms_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d dwms_db']
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:latest
    restart: always
    ports:
      - 6380:6379
volumes:
  postgres_data:
